services:
  - type: web
    name: fashionstore-api-si2
    runtime: python
    repo: https://github.com/bmateo637coder/ParcialSI2
    branch: feat/parcial2-vestidor-bitacora-reembolsos-despliegue
    autoDeployTrigger: "off"
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "600"
      - key: AUTO_SEED
        value: "false"
      - key: ALLOW_DEMO_PASSWORD_RESET
        value: "false"
      - key: API_PREFIX
        value: /api
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: fashionstore-web-si2
    runtime: static
    repo: https://github.com/bmateo637coder/ParcialSI2
    branch: feat/parcial2-vestidor-bitacora-reembolsos-despliegue
    autoDeployTrigger: "off"
    rootDir: frontend-web
    buildCommand: npm ci && npm run build
    staticPublishPath: browser/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /app-config.js
        name: Cache-Control
        value: no-cache
      - path: /ngsw.json
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
    envVars:
      - key: FASHIONSTORE_API_URL
        sync: false
      - key: NODE_VERSION
        value: 24.20.0
