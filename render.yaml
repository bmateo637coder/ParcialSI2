services:
  - type: web
    name: fashionstore-api-si2
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 600
      - key: API_PREFIX
        value: /api
      - key: BACKEND_CORS_ORIGINS
        value: https://fashionstore-web-si2.onrender.com,http://localhost:4200
      - key: GENAI_API_KEY
        sync: false

  - type: web
    name: fashionstore-web-si2
    runtime: static
    plan: free
    rootDir: frontend-web
    buildCommand: npm ci && npx ng build --configuration production
    staticPublishPath: dist/frontend-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
