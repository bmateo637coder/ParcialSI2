org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Compilar Kotlin dentro del daemon de Gradle sin caches incrementales
# evita fallos por presión de memoria en máquinas con poca RAM.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false